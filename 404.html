<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 - HelloFrom.cn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <base target="_blank">
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3f37c9;
      --accent: #4cc9f0;
      --success: #4ade80;
      --warning: #f87171;
      
      /* 亮色模式变量 */
      --bg-gradient: linear-gradient(135deg, #e6f0ff 0%, #f8fbff 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-color: #1f2937;
      --text-secondary: #64748b;
      --border-color: rgba(203, 213, 225, 0.5);
      --icon-color: #4361ee;
      --header-gradient: linear-gradient(to right, var(--primary), var(--accent));
      --card-shadow: 0 8px 32px rgba(30, 41, 59, 0.1);
      --light: #f8fafc;
      --glass-bg: rgba(255, 255, 255, 0.7);
    }
    
    .dark-mode {
      /* 暗色模式变量 */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-color: #e2e8f0;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --icon-color: #60a5fa;
      --header-gradient: linear-gradient(to right, #818cf8, #60a5fa);
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      --light: rgba(30, 41, 59, 0.5);
      --glass-bg: rgba(30, 41, 59, 0.5);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
    }
    
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }
    
    /* 背景动画元素 */
    .bg-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
    
    .shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      opacity: 0.1;
      filter: blur(60px);
      animation: float 15s infinite ease-in-out;
    }
    
    .shape:nth-child(1) {
      width: 300px;
      height: 300px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .shape:nth-child(2) {
      width: 400px;
      height: 400px;
      top: 60%;
      right: 10%;
      animation-delay: 3s;
    }
    
    .shape:nth-child(3) {
      width: 250px;
      height: 250px;
      bottom: 20%;
      left: 30%;
      animation-delay: 6s;
    }
    
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    /* 顶部控制栏 */
    .top-controls {
      position: absolute;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 15px;
      z-index: 100;
    }
    
    .control-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      backdrop-filter: blur(10px);
    }
    
    .control-btn:hover {
      transform: translateY(-5px) rotate(8deg);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      background: var(--primary);
      color: white;
    }
    
    header {
      text-align: center;
      padding: 60px 0 30px;
      margin-bottom: 20px;
      animation: fadeIn 1.2s ease;
      position: relative;
      width: 100%;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .error-logo {
      width: 180px;
      height: 180px;
      background: var(--header-gradient);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      color: white;
      font-size: 4.5rem;
      box-shadow: 0 10px 30px rgba(67, 97, 238, 0.4);
      position: relative;
      overflow: hidden;
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      animation: float 6s ease-in-out infinite, pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .error-logo:hover {
      transform: scale(1.05) rotate(5deg);
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    
    .error-logo::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
      transform: rotate(30deg);
      animation: shine 8s infinite;
    }
    
    @keyframes shine {
      0% { transform: rotate(30deg) translateX(-100%); }
      20% { transform: rotate(30deg) translateX(100%); }
      100% { transform: rotate(30deg) translateX(100%); }
    }
    
    h1 {
      font-size: 4.5rem;
      margin-bottom: 15px;
      font-weight: 800;
      background: var(--header-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .subtitle {
      font-size: 1.5rem;
      max-width: 700px;
      margin: 0 auto 40px;
      color: var(--text-secondary);
      font-weight: 400;
    }
    
    /* 毛玻璃效果卡片 */
    .error-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 35px;
      margin-bottom: 35px;
      box-shadow: var(--card-shadow);
      animation: slideUp 1s ease;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      transition: all 0.5s ease;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    
    .error-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }
    
    .error-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--header-gradient);
      z-index: 1;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .error-card-title {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
      color: var(--primary);
      padding-bottom: 18px;
      border-bottom: 2px solid var(--border-color);
    }
    
    .error-card-title i {
      margin-right: 15px;
      font-size: 2.2rem;
      background: var(--header-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .error-description {
      font-size: 1.2rem;
      margin-bottom: 35px;
      color: var(--text-secondary);
      line-height: 1.8;
    }
    
    .action-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .action-btn {
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      min-width: 200px;
      border: none;
    }
    
    .primary-btn {
      background: var(--header-gradient);
      color: white;
    }
    
    .secondary-btn {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    
    .action-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, var(--secondary), var(--primary));
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    
    .action-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3);
    }
    
    .action-btn:hover::before {
      opacity: 1;
    }
    
    .action-btn:active {
      transform: translateY(1px) scale(0.98);
    }
    
    .action-btn span {
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }
    
    .action-btn i {
      margin-left: 8px;
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }
    
    .action-btn:hover span {
      transform: translateX(5px);
    }
    
    .action-btn:hover i {
      transform: translateX(8px);
    }
    
    .secondary-btn::before {
      background: linear-gradient(to right, var(--primary-light), var(--accent));
    }
    
    .secondary-btn:hover {
      color: white;
    }
    
    .error-details {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    
    .error-detail {
      background: rgba(67, 97, 238, 0.1);
      padding: 15px 25px;
      border-radius: 50px;
      font-size: 0.95rem;
      color: var(--text-color);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }
    
    .error-detail:hover {
      transform: translateY(-5px);
      background: rgba(67, 97, 238, 0.15);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .error-detail i {
      margin-right: 8px;
      color: var(--primary);
    }
    
    footer {
      padding: 35px 0;
      margin-top: auto;
      font-size: 1rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      width: 100%;
      text-align: center;
    }
    
    .footer-info {
      text-align: center;
      font-size: 1rem;
      line-height: 1.7;
    }
    
    .footer-info p {
      margin-bottom: 12px;
    }
    
    .email-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: var(--transition);
    }
    
    .email-link:hover {
      color: var(--secondary);
      text-decoration: underline;
    }
    
    /* 黑暗模式切换动画 */
    .theme-icon {
      transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55), 
                 opacity 0.5s ease;
    }
    
    .sun-icon {
      opacity: 1;
      transform: rotate(0deg);
    }
    
    .dark-mode .sun-icon {
      opacity: 0;
      transform: rotate(90deg);
    }
    
    .moon-icon {
      position: absolute;
      opacity: 0;
      transform: rotate(-90deg);
    }
    
    .dark-mode .moon-icon {
      opacity: 1;
      transform: rotate(0deg);
    }
    
    /* 粒子背景效果 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.1;
      animation: floatParticle 15s infinite linear;
    }
    
    @keyframes floatParticle {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0.1;
      }
      50% {
        opacity: 0.15;
      }
      100% {
        transform: translateY(-100px) translateX(50px);
        opacity: 0;
      }
    }
    
    @media (max-width: 768px) {
      .error-logo {
        width: 140px;
        height: 140px;
        font-size: 3.5rem;
      }
      
      h1 {
        font-size: 3.5rem;
      }
      
      .subtitle {
        font-size: 1.3rem;
      }
      
      .action-buttons {
        flex-direction: column;
        align-items: center;
      }
      
      .action-btn {
        width: 100%;
        max-width: 300px;
      }
      
      .error-details {
        flex-direction: column;
        align-items: center;
      }
      
      .top-controls {
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- 背景动画元素 -->
  <div class="bg-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <!-- 粒子背景 -->
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <!-- 顶部控制按钮 -->
    <div class="top-controls">
      <a href="https://hellofrom.cn" class="control-btn">
        <i class="fas fa-home"></i>
      </a>
      <div class="control-btn" id="theme-toggle">
        <i class="fas fa-sun sun-icon theme-icon"></i>
        <i class="fas fa-moon moon-icon theme-icon"></i>
      </div>
    </div>

    <header>
      <div class="error-logo">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <h1>404</h1>
      <p class="subtitle">
        哎呀，我们似乎找不到您要访问的页面
      </p>
    </header>

    <main>
      <div class="error-card">
        <div class="error-card-title">
          <i class="fas fa-map-signs"></i>
          <h2>页面未找到</h2>
        </div>
        
        <div class="error-description">
          您访问的页面可能已被移除、名称更改或暂时不可用。请检查您输入的URL是否正确，或尝试使用下面的选项。
        </div>
        
        <div class="action-buttons">
          <a href="https://hi.hellofrom.cn" class="action-btn primary-btn">
            <span>返回首页</span> <i class="fas fa-home"></i>
          </a>
          <a href="javascript:history.back()" class="action-btn secondary-btn">
            <span>返回上一页</span> <i class="fas fa-arrow-left"></i>
          </a>
        </div>
        
        <div class="error-details">
          <div class="error-detail">
            <i class="fas fa-search"></i> 检查网址拼写
          </div>
          <div class="error-detail">
            <i class="fas fa-sync-alt"></i> 刷新页面重试
          </div>
          <div class="error-detail">
            <i class="fas fa-envelope"></i> 联系支持团队
          </div>
        </div>
      </div>
    </main>
    
    <footer>
      <div class="footer-info">
        <p>© 2025 HelloFrom.cn | 安全上网，自由探索</p>
        <p>遇到问题？联系支持: <a href="mailto:yangle.q@outlook.com" class="email-link">yangle.q@outlook.com</a></p>
      </div>
    </footer>
  </div>

  <script>
    // 黑暗模式切换
    const themeToggle = document.getElementById('theme-toggle');
    
    // 检查本地存储或系统偏好
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.body.classList.add('dark-mode');
    }
    
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      
      if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
      
      // 添加动画效果
      themeToggle.style.transform = 'scale(1.2)';
      setTimeout(() => {
        themeToggle.style.transform = 'scale(1)';
      }, 300);
    });

    // 粒子背景效果
    function createParticles() {
      const particles = document.getElementById('particles');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // 随机属性
        const size = Math.random() * 5 + 2;
        const posX = Math.random() * 100;
        const posY = Math.random() * 100;
        const delay = Math.random() * 15;
        const duration = Math.random() * 10 + 10;
        const color = `hsl(${Math.random() * 360}, 70%, 60%)`;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${posX}%`;
        particle.style.top = `${posY}%`;
        particle.style.background = color;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${delay}s`;
        
        particles.appendChild(particle);
      }
    }
    
    // 初始化页面
    document.addEventListener('DOMContentLoaded', function() {
      // 创建粒子背景
      createParticles();
      
      // 背景形状动画
      const shapes = document.querySelectorAll('.shape');
      shapes.forEach(shape => {
        const duration = Math.random() * 20 + 10;
        shape.style.animationDuration = `${duration}s`;
      });
      
      // 错误标志动画
      const errorLogo = document.querySelector('.error-logo');
      setInterval(() => {
        errorLogo.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;
      }, 3000);
    });
  </script>
</body>
</html>
